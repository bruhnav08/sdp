<!-- HTMX partial: event <option> list for the booking form dropdown -->
{% if events %}
  {% for event in events %}
  <option value="{{ event.id }}" data-date="{{ event.event_date|date:'Y-m-d' }}">
    {{ event.name }} ({{ event.event_date|date:"d M Y" }})
  </option>
  {% endfor %}
{% else %}
  <option value="" disabled>No events found for selected campus</option>
{% endif %}
