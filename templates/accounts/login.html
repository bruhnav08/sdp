<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In &mdash; HSRS ERP</title>
  <meta name="description" content="Sign in to the HSRS Guest Room Booking System">
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <script>
    (function(){
      var t = localStorage.getItem('hsrs-theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>

<div class="login-page">
  <div class="login-card">

    <div class="login-card__header">
      <div class="login-logo">HSRS</div>
      <h1>HSRS ERP</h1>
      <p>Guest Room Booking System</p>
    </div>

    <div class="login-card__body">

      <div class="login-theme-toggle">
        <button class="login-theme-btn" id="login-theme-toggle" onclick="toggleTheme()">Dark Mode</button>
      </div>

      {% if messages %}
        {% for message in messages %}
          <div class="alert alert--{{ message.tags|default:'error' }}" style="margin-bottom:1rem">
            <span>{{ message }}</span>
          </div>
        {% endfor %}
      {% endif %}

      <form method="post" action="{% url 'accounts:login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">
        {% csrf_token %}
        {% if request.GET.next %}
          <input type="hidden" name="next" value="{{ request.GET.next }}">
        {% endif %}

        <div class="login-field">
          <label for="id_username">Username</label>
          <input
            type="text"
            id="id_username"
            name="username"
            value="{{ username|default:'' }}"
            placeholder="Enter your username"
            autocomplete="username"
            autofocus
            required
          >
        </div>

        <div class="login-field">
          <label for="id_password">Password</label>
          <input
            type="password"
            id="id_password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
        </div>

        <button type="submit" class="login-btn" id="login-submit-btn">
          Sign In
        </button>
      </form>

    </div>

    <div class="login-card__footer">
      <p>Hostel &amp; Guest Room Booking &nbsp;&middot;&nbsp; ESPro ERP</p>
    </div>
  </div>
</div>

<script>
  function toggleTheme() {
    var html = document.documentElement;
    var next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('hsrs-theme', next);
    var btn = document.getElementById('login-theme-toggle');
    if (btn) btn.textContent = next === 'dark' ? 'Light Mode' : 'Dark Mode';
  }
  (function(){
    var saved = localStorage.getItem('hsrs-theme') || 'light';
    var btn = document.getElementById('login-theme-toggle');
    if (btn) btn.textContent = saved === 'dark' ? 'Light Mode' : 'Dark Mode';
  })();
</script>
</body>
</html>
